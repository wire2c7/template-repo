# release ブランチの内容からテンプレート開発専用のものを除去し、main へのPRを作成・更新する
name: Release to main

on:
  push:
    branches: [release]

# push・PR作成は RELEASE_PR_TOKEN（PAT）で行い、GITHUB_TOKEN は使わない
permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  PR_BRANCH: release-to-main

jobs:
  pr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # GITHUB_TOKEN ではワークフローファイルを含むコミットを push できず、作成したPRでCIも起動しないため PAT が必須
      - name: Check RELEASE_PR_TOKEN
        env:
          RELEASE_PR_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
        run: |
          if [[ -z $RELEASE_PR_TOKEN ]]; then
            echo "::error::Secrets に RELEASE_PR_TOKEN が登録されていません（TEMPLATE_DEVELOPMENT.md 参照）"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PR_TOKEN }}

      - name: Build template snapshot
        id: build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          release_sha=$(git rev-parse HEAD)
          echo "release-sha=$release_sha" >> "$GITHUB_OUTPUT"

          # スクリプト自身も除去対象なので退避してから実行する
          cp .github/scripts/strip-template-dev.sh "$RUNNER_TEMP/"

          # main を起点に、ツリーを release の内容で丸ごと置き換える（差分は main のスナップショットとの差になる）
          git switch --create "$PR_BRANCH" origin/main
          git read-tree -u --reset "$release_sha"
          "$RUNNER_TEMP/strip-template-dev.sh"
          git add --all

          if git diff --cached --quiet origin/main; then
            echo "main はすでに最新です"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            # release も親にして、main の履歴から反映元の release をたどれるようにする
            tree=$(git write-tree)
            commit=$(git commit-tree "$tree" -p origin/main -p "$release_sha" \
              -m "chore(release): release@${release_sha::7} をテンプレートに反映")
            git reset --quiet "$commit"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update pull request
        if: steps.build.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          RELEASE_SHA: ${{ steps.build.outputs.release-sha }}
        run: |
          git push --force origin "$PR_BRANCH"

          body=$(cat <<BODY
          \`release\` ブランチ（${RELEASE_SHA}）からテンプレート開発専用のファイル・記述を除去した内容です。

          - 除去対象: \`.templateignore\` と \`template-dev:begin\`〜\`template-dev:end\` のブロック
          - このPRは \`release\` への push のたびに自動で更新されます
          BODY
          )

          pr=$(gh pr list --head "$PR_BRANCH" --base main --state open --json number --jq '.[0].number')
          if [[ -n $pr ]]; then
            gh pr edit "$pr" --body "$body"
          else
            gh pr create --head "$PR_BRANCH" --base main --title "chore(release): テンプレートを更新" --body "$body"
          fi
