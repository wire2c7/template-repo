ls:
  .claude/hooks:
    .sh: kebab-case

  .claude/rules:
    .md: kebab-case

  .claude/skills/*:
    .dir: kebab-case
    .md: regex:^SKILL$

  .github/scripts:
    .sh: kebab-case

  .github/workflows:
    .yaml: kebab-case

  docs/adr:
    .md: regex:^(_template|[0-9]{4}-[a-z0-9]+(-[a-z0-9]+)*)$
